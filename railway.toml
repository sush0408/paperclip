[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
startCommand = "node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[service]
internalPort = 3100
